  <style>:root {
  color-scheme:light;
  --ink:#333333;
  --ink-soft:#5d5967;
  --muted:#77717f;
  --line:#e7e2ed;
  --purple:#453259;
  --purple-deep:#322242;
  --purple-light:#f2edf7;
  --bg:#f9f8fb;
  --danger:#b53343;

* {box-sizing:border-box}
html {scroll-behavior:smooth}
body {margin:0;background:var(--bg);color:var(--ink)}
button,input {font:inherit}
button {cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible {outline:2px solid #80699e;outline-offset:2px}
a {color:var(--purple)}
.page-shell {width:min(calc(100% - 28px),850px);margin:0 auto}
.site-header {display:grid;grid-template-columns:max-content minmax(0,1fr) max-content;align-items:center;column-gap:18px;padding:20px 0 24px}
.brand {display:flex;align-items:center;gap:7px;white-space:nowrap}
.brand-icon {width:25px;height:25px;display:grid;place-items:center;background:var(--purple);color:#fff;border-radius:6px;font-size:17px;line-height:1}
.brand strong {font-size:15px;font-weight:680;letter-spacing:-.02em}
.header-statement {margin:0;text-align:center;white-space:nowrap;color:var(--muted);font-size:11px;line-height:1.4;overflow:hidden;text-overflow:ellipsis}
.language-switch {display:flex;align-items:center;gap:6px;white-space:nowrap;font-size:12px;color:#aaa4b2}
.language-button {border:0;padding:3px 1px;background:none;color:#7c7585;font-size:12px;font-weight:400}
.language-button.active {color:var(--purple);text-decoration:underline;text-underline-offset:4px}
.search-panel {margin:0 0 22px}
.search-label {display:block;color:var(--ink-soft);font-size:12px;font-weight:400;margin-bottom:8px}
.search-field {display:flex;align-items:center;min-width:0;height:42px;border:1px solid #ccc4d5;background:#fff;border-radius:9px;overflow:hidden;transition:border-color .15s}
.search-field:focus-within {border-color:var(--purple)}
.search-field input {min-width:0;flex:1;width:100%;padding:8px 11px;border:0;outline:0;font-size:13px;color:var(--ink);background:transparent}
.search-field input::placeholder {color:#9a94a1}
.search-field input::-webkit-search-cancel-button {cursor:pointer}
.search-field button {width:43px;height:100%;border:0;background:transparent;color:var(--purple);display:grid;place-items:center;padding:0}
.search-field button:hover {background:var(--purple-light)}
.search-field svg {width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.filters-line {display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px;border-bottom:1px solid var(--line)}
.filters {display:flex;align-items:center;gap:17px;overflow:auto;scrollbar-width:none}
.filters::-webkit-scrollbar {display:none}
.filter {border:0;border-bottom:2px solid transparent;margin:0;background:transparent;padding:8px 0 9px;white-space:nowrap;color:var(--muted);font-size:12px;font-weight:400}
.filter.active {color:var(--purple);border-bottom-color:var(--purple)}
.count {white-space:nowrap;font-size:11px;color:var(--muted)}
.product-list {display:grid;grid-template-columns:1fr;gap:9px}
.product-card {background:white;border:1px solid var(--line);border-radius:12px;overflow:hidden}

.thumb,.photo-large {width:100%;height:100%;display:grid;place-items:center;position:relative;background:#faf9fb;overflow:hidden}
.thumb img,.photo-large img {width:100%;height:100%;object-fit:contain}
.photo-fallback {display:flex;position:absolute;inset:0;background:#f2eff5;color:#81748d;align-items:center;justify-content:center;text-align:center;padding:6px;font-size:10px;line-height:1.45}
.photo-fallback.hidden {display:none}

.thumb .photo-fallback.no-photo {font-size:9px;padding:3px}

.card-topline {display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin:0 0 4px}

.card-summary h3 {margin:0 0 4px;font-size:14px;line-height:1.35;font-weight:650;overflow-wrap:anywhere}
.name-nl {margin:0;color:var(--ink-soft);font-size:11px;line-height:1.4;overflow-wrap:anywhere}

.is-expanded .card-detail {display:block}

-1 Oogdruppels","name":{"zh":"Prevalin Direct 5合1眼药水","en":"Prevalin Direct 5-in-1 eye drops"},"searchTerms":["prevalin","direct","眼药水","eye drops","oogdruppels"],"keywords":[{"nl":"Oogdruppels","en":"Eye drops","zh":"眼药水"}],"clerk":[{"nl":"Jeukende ogen","en":"Itchy eyes","zh":"眼睛发痒"},{"nl":"Tranende ogen","en":"Watery eyes","zh":"流眼泪"}],"photo":"","source":"https://www.kruidvat.nl/prevalin-direct-5-in-1-oogdruppels/p/5416601","audience":"general","verified":"2026-11-08","description":{"zh":"这是 Prevalin Direct 的五合一滴眼液，官网介绍其涉及眼痒、流泪、干涩、发红和疲劳感五种眼部表现。产品主打保湿及舒缓，也说明可用于隐形眼镜佩戴者；并非含抗组胺药的 Carelastin 滴眼液。","en":"Prevalin Direct 5-in-1 eye drops are described for five eye complaints: itching, watering, dryness, redness and tiredness. Kruidvat emphasizes moisturizing and soothing properties and mentions contact-lens wearers; these are distinct from Carelastin antihistamine drops."},"nameParts":[{"nl":"Prevalin Direct","en":"Brand name","zh":"品牌名","kind":"brand"},{"nl":"5-in-1","en":"Five-in-one","zh":"五合一","kind":"meaning"},{"nl":"Oogdruppels","en":"Eye drops","zh":"眼药水","kind":"meaning"}],"descriptionReview":{"status":"official-page-reviewed","source":"https://www.kruidvat.nl/prevalin-direct-5-in-1-oogdruppels/p/5416601","date":"2026-11-08"}},{"id":"nose-carelastin","category":"nose","sku":"5611047","size":"10 ml","dutchName":"Carelastin Extra Sterk Neusspray","name":{"zh":"Carelastin 强效鼻喷雾","en":"Carelastin extra-strength nasal spray"},"searchTerms":["carelastin","azelastine","阿左斯汀","鼻喷雾","nasal spray","neusspray"],"keywords":[{"nl":"Azelastine","en":"Azelastine","zh":"阿左斯汀"},{"nl":"Neusspray","en":"Nasal spray","zh":"鼻喷雾"}],"clerk":[{"nl":"Niezen","en":"Sneezing","zh":"打喷嚏"},{"nl":"Loopneus","en":"Runny nose","zh":"流鼻涕"}],"photo":"","source":"https://www.kruidvat.nl/carelastin-extra-sterk-neusspray/p/5611047","audience":"general","verified":"2026-11-08","description":{"zh":"Carelastin Extra Sterk 是含阿左斯汀（Azelastine）的抗组胺鼻喷雾。官网介绍其涉及花粉、尘螨及宠物过敏相关的喷嚏、流涕和鼻塞，并称约15分钟开始起效；它不是海盐清洗喷雾。", 胃酸抑制胶囊的有效成分是奥美拉唑（Omeprazol），官网规格为10毫克。属于胃溶保护型胶囊，介绍中将其用于短期缓解胃酸反流和反酸相关症状；不是 Rennie 那类直接中和胃酸的咀嚼片。","en":"These gastro-resistant capsules contain 10 mg omeprazole. Kruidvat lists them for short-term acid-reflux and heartburn symptoms; unlike Rennie-type antacid chewables, the active ingredient is a proton-pump inhibitor."},"nameParts":[{"nl":"Kruidvat","en":"Brand name","zh":"品牌名","kind":"brand"},{"nl":"Maagzuurremmende","en":"Acid suppressing","zh":"抑制胃酸的","kind":"meaning"},{"nl":"Capsules","en":"Capsules","zh":"胶囊","kind":"meaning"}],"descriptionReview":{"status":"official-page-reviewed","source":"https://www.kruidvat.nl/kruidvat-maagzuurremmende-capsules/p/5530939","date":"2026-11-08"}},{"id":"digestive-metamucil","category":"digestive","sku":"4109127","size":"30 stuks","dutchName":"Metamucil Orange Sachets","name":{"zh":"Metamucil 车前子纤维橙味冲剂","en":"Metamucil orange ispaghula-fiber sachets"},"searchTerms":["metamucil","车前子壳","psyllium","sachets","冲剂","ispaghula husk"],"keywords":[{"nl":"Metamucil","en":"Metamucil","zh":"Metamucil 品牌"},{"nl":"Sachets","en":"Sachets","zh":"小袋装"}],"clerk":[{"nl":"Verstopping","en":"Constipation","zh":"便秘"}],"photo":"","source":"https://www.kruidvat.nl/metamucil-orange-sachets/p/4109127","audience":"general","verified":"2026-11-08","description":{"zh":"Metamucil Orange 是橙味袋装纤维粉，官网有效成分为车前子壳（Ispaghula husk），每袋3.4克。其介绍针对长期或反复的便秘问题；这是吸水膨胀的纤维制剂，不是 Dulcolax 那类刺激性泻药。","en":"Metamucil Orange sachets contain 3.4 g ispaghula husk (psyllium fiber) per sachet. Kruidvat describes them for long-lasting or recurring constipation; this bulk-forming fiber product differs from stimulant-laxative Dulcolax."},"nameParts":[{"nl":"Metamucil","en":"Brand name","zh":"品牌名","kind":"brand"},{"nl":"Orange","en":"Orange flavour","zh":"橙味","kind":"meaning"},{"nl":"Sachets","en":"Sachets","zh":"独立小袋装","kind":"meaning"}],"descriptionReview":{"status":"official-page-reviewed","source":"https://www.kruidvat.nl/metamucil-orange-sachets/p/4109127","date":"2026-11-08"}},{"id function filterProducts(items, query, category = 'all') {

  return items.filter(item => {
    if (category !== 'all' && category !== item.category) return false;

  const checked=labels.verified.replace('2026-11-08',item.verified||'2026-11-08');
  return `<div class="card-detail" id="detail-${escapeHtml(item.id)}">
    <div class="detail-layout">
      <div class="detail-left"><div class="detail-photo">
        <button class="photo-large-button" type="button" data-image="${escapeHtml(item.id)}" aria-label="${escapeHtml(labels.zoom)}">
          ${photoMarkup(item,true)}</button>
        <div class="photo-caption">
          <span class="photo-source"><span>${escapeHtml(checked)}</span><a href="${escapeHtml(item.source)}" target="_blank" rel="noopener noreferrer">${escapeHtml(labels.source)} ↗</a></span>
          <button type="button" class="summary-launch" data-summary="${escapeHtml(item.id)}">${escapeHtml(labels.summary)}</button>
          <button type="button" class="zoom-button" data-image="${escapeHtml(item.id)}">${escapeHtml(labels.zoom)}</button>
        </div>
      </div></div>
      <div class="detail-right"><section class="guide-section"><h4>${escapeHtml(labels.look)}</h4>${keywordTable(item)}</section>${clerkTable(item)}</div>
    </div>
    <div class="disclaimer"><p lang="zh-CN">${escapeHtml(labels.warningZh)}</p><p lang="en">${escapeHtml(labels.warningEn)}</p></div>
  </div>`;
}
function cardMarkup(item) {
  const labels=t();
  const expanded=state.expanded===item.id;
  const heading=item.name[state.language];
  const other=item.name[state.language==='zh'?'en':'zh'];
  return `<article class="product-card${expanded?' is-expanded':''}" id="card-${escapeHtml(item.id)}">
    <div class="card-main">
      <button type="button" class="thumb-button" data-image="${escapeHtml(item.id)}" aria-label="${escapeHtml(labels.zoom)}">${photoMarkup(item)}</button>
      <div class="card-summary"><div class="card-topline"><span class="mini-pill">${escapeHtml(labels[item.category])}</span><span class="sku">${escapeHtml(item.size)} · #${escapeHtml(item.sku)}</span></div>
        <h3>${escapeHtml(heading)}</h3><p class="name-nl" lang="nl">${escapeHtml(item.dutchName)}</p>
        <span class="card-english" lang="${state.language==='zh'?'en':'zh-CN'}">${escapeHtml(other)}</span></div>
      <button type="button" class="expand-button" data-expand="${escapeHtml(item.id)}" aria-expanded="${expanded}" aria-controls="detail-${escapeHtml(item.id)}">
        ${escapeHtml(expanded?labels.close:labels.open)} <span class="expand-symbol" aria-hidden="true">${expanded?'−':'+'}</span></button>
    </div>${expanded?detailMarkup(item):`<div class="card-detail" id="detail-${escapeHtml(item.id)}"></div>`}
  </article>`;
}
function initializeImages(parent) {
  parent.querySelectorAll('img').forEach(img=>{
    const ready=()=>{img.style.visibility='visible';img.parentElement.classList.add('has-photo');img.parentElement.querySelector('.photo-fallback')?.classList.add('hidden');};
    const failed=()=>{img.style.visibility='hidden';img.parentElement.classList.remove('has-photo');img.parentElement.querySelector('.photo-fallback')?.classList.remove('hidden');};
    img.addEventListener('load',ready,{once:true});
    img.addEventListener('error',failed,{once:true});
    if(img.complete)(img.naturalWidth>0?ready:failed)();
  });
}
function renderCards() {
  const found=filterProducts(products,state.query,state.category);
  if(state.expanded && !found.some(p=>p.id===state.expanded))state.expanded=null;
  $('#result-count').textContent=t().results(found.length);
  $('#product-list').innerHTML=found.map(cardMarkup).join('');
  $('#empty-state').hidden=found.length!==0;
  initializeImages($('#product-list'));
}
function renderText() {
  const labels=t();
  document.documentElement.lang=state.language==='zh'?'zh-CN':'en';
  $('#brand-name').textContent=labels.brand;
  $('#header-statement').textContent=labels.statement;
  $('#search-label').textContent=labels.searchLabel;
  $('#search').placeholder=labels.placeholder;
  $('#search-submit').setAttribute('aria-label',labels.search);
  $('#search-submit').title=labels.search;
  $('#empty-title').textContent=labels.emptyTitle;
  $('#empty-description').textContent=labels.emptyText;
  $('#footer-nonofficial').textContent=labels.footer;
  $('#close-image').setAttribute('aria-label',labels.imageClose);
  $('#summary-source').textContent=labels.summarySource;
  if(activeSummaryProduct) renderSummary();
  $$('[data-language]').forEach(btn=>{const active=btn.dataset.language===state.language;btn.classList.toggle('active',active);btn.setAttribute('aria-pressed',String(active));});
  $$('[data-category]').forEach(btn=>{const active=btn.dataset.category===state.category;btn.classList.toggle('active',active);btn.setAttribute('aria-pressed',String(active));btn.textContent=labels[btn.dataset.category];});
  // Static Chinese metadata exists for crawlers; update the sharing/title summary for live English users.
  const title = state.language==='zh'?'K店识别卡｜荷兰 Kruidvat 商品识别与包装名称拆解｜Expatus':'K店识别卡 | Kruidvat Product Name Breakdown | Expatus';
  document.title=title;
  const desc=state.language==='zh'
    ?'K店识别卡（Expatus）：Kruidvat 商品识别与荷兰语包装名称拆解，提供中英翻译、客观商品简述、英语专业词发音和店员沟通词。'
    :'Free Chinese-English translations of Kruidvat product names and selected Dutch packaging terms, with English IPA. No medical interpretation or recommendations.';
  document.querySelector('meta[name="description"]').content=desc;
  document.querySelector('meta[property="og:title"]').content=state.language==='zh'?'K店识别卡 | Kruidvat Label Guide':'Kruidvat Label Guide';
  document.querySelector('meta[property="og:description"]').content=desc;
  setAnalyticsLanguage(state.language);
  renderCards();
}
function openImage(item) {
  const dialog=$('#image-dialog');
  $('#image-dialog-content').innerHTML=photoMarkup(item,true).replace('class="photo-large"','class="photo-large image-dialog-photo"');
  initializeImages($('#image-dialog-content'));
  if(!dialog.open)dialog.showModal();
}
function closeImage() {const dialog=$('#image-dialog');if(dialog.open)dialog.close();}
function renderSummary(){
  if(!activeSummaryProduct)return;
  $('#summary-heading').textContent=t().summary+' · '+activeSummaryProduct.name[state.language];
  $('#summary-body').textContent=activeSummaryProduct.description?.[state.language]||'';
  $('#summary-source').textContent=t().summarySource;
}
function openSummary(item){
  activeSummaryProduct=item;
  renderSummary();
  if(!$('#summary-dialog').open)$('#summary-dialog').showModal();
}
function closeSummary(){
  const dialog=$('#summary-dialog');
  if(dialog.open) dialog.close();
  activeSummaryProduct=null;
}
function initEvents() {
  $('#search-form').addEventListener('submit',e=>{
    e.preventDefault();cancelSpeech();state.query=$('#search').value.trim();renderCards();
  });
  // Clearing the built-in x of the search field restores the unfiltered results.
  $('#search').addEventListener('input',e=>{if(e.target.value===''){state.query='';renderCards();}});
  $$('[data-language]').forEach(btn=>btn.addEventListener('click',()=>{
    cancelSpeech();state.language=btn.dataset.language;
    try{localStorage.setItem('kruidvat-guide-language',state.language);}catch{}
    renderText();
  }));
  $$('[data-category]').forEach(btn=>btn.addEventListener('click',()=>{
    cancelSpeech();state.category=btn.dataset.category;renderText();
  }));
  $('#product-list').addEventListener('click',e=>{
    const summary=e.target.closest('[data-summary]');
    if(summary){const item=products.find(p=>p.id===summary.dataset.summary);if(item)openSummary(item);return;}
    const image=e.target.closest('[data-image]');
    if(image){const item=products.find(p=>p.id===image.dataset.image);if(item)openImage(item);return;}
    const expand=e.target.closest('[data-expand]');
    if(expand){cancelSpeech();const id=expand.dataset.expand;state.expanded=state.expanded===id?null:id;renderCards();return;}
    const speaker=e.target.closest('[data-pronounce]');
    if(speaker){const word=speaker.dataset.pronounce;const entry=difficultTerms[word.toLowerCase()];
      if(entry?.status==='verified' && entry.ipa)speakEnglish(word,speaker);}
  });
  $('#close-summary').addEventListener('click',closeSummary);
  $('#summary-dialog').addEventListener('click',e=>{if(e.target===$('#summary-dialog'))closeSummary();});
  $('#summary-dialog').addEventListener('close',()=>{activeSummaryProduct=null;});
  $('#close-image').addEventListener('click',closeImage);
  $('#image-dialog').addEventListener('click',e=>{if(e.target===$('#image-dialog'))closeImage();});
}
async function init() {
  initEvents();
  try{const saved=localStorage.getItem('kruidvat-guide-language');if(saved==='zh'||saved==='en')state.language=saved;}catch{}
  initAnalytics();
  try{
    products=JSON.parse(document.getElementById('embedded-products').textContent);
    difficultTerms=JSON.parse(document.getElementById('embedded-difficult-terms').textContent);
    // Hard exclusion: no infant, baby, maternal or child-targeted products are permitted.
    products=products.filter(p=>p.audience==='general' && !FORBIDDEN_AUDIENCE.test(JSON.stringify([p.id,p.dutchName,p.name,p.searchTerms,p.keywords,p.clerk])));
    renderText();
  }catch(e){console.error(e);toast(t().loadFailed);$('#empty-state').hidden=false;$('#empty-title').textContent=t().loadFailed;}
}
if(typeof document!=='undefined')init();
</script>
</body>
</html>
