<div class="expatus-admin-table-wrap"><table class="expatus-admin-table"><thead><tr><th>时间</th><th>事件</th><th>用户</th><th>结果</th></tr></thead><tbody>{% for event in compact_events %}<tr><td><time>{{ event.created_at[:16].replace('T', ' ') }} UTC</time></td><td>{{ event.event_type }}</td><td>{{ event.email or event.subject or '—' }}</td><td><span class="expatus-admin-pill{% if event.outcome != 'success' %} is-denied{% endif %}">{{ event.outcome }}</span></td></tr>{% else %}<tr><td colspan="4" class="expatus-admin-empty">暂无活动记录。</td></tr>{% endfor %}</tbody></table></div>
