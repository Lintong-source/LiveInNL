    function renderCityTabs() {
      const container = document.getElementById('cityTabs');

        `<button class="city-tab ${c.id === currentCity ? 'active' : ''}" onclick="setCity('${c.id}')">${c.name}</button>`
      ).join('');
    }

    function setCity(cityId) {
      currentCity = cityId;
      renderCityTabs();
      filterPlatforms();
    }

    function toggleFav(id) {
      const idx = favorites.indexOf(id);
      if (idx > -1) favorites.splice(idx, 1);
      else favorites.push(id);
      localStorage.setItem('nl_rental_favs', JSON.stringify(favorites));
      filterPlatforms();
    }

    function renderCard(p) {
      const isFav = favorites.includes(p.id);
      const typeLabels = { student: '学生宿舍', commercial: '商业平台', social: '社交/合租', short: '短租过渡' };
      const typeClass = `type-${p.type}`;
      const cityNames = p.cities.map(c => cities.find(x => x.id === c)?.name).filter(Boolean).join('、');
      
      return `
        <div class="platform-card" id="card-${p.id}">
          <div class="platform-header">
            <div>
              <div class="platform-name">${p.name} <button class="star-btn ${isFav ? 'active' : ''}" onclick="event.stopPropagation(); toggleFav('${p.id}')">★</button></div>
              <div style="font-size:12px;color:#999;margin-top:4px;">${cityNames || '全荷兰'}</div>
            </div>
            <span class="platform-type ${typeClass}">${typeLabels[p.type]}</span>
          </div>
          <div class="platform-desc">${p.desc}</div>
          <div class="platform-meta">
            <span class="price">💰 ${p.price}</span>
            <span class="${p.fee.includes('免费') ? 'free' : 'fee'}">📝 ${p.fee}</span>
          </div>
          <div class="platform-actions">
            <a class="btn btn-primary" href="${p.url}" target="_blank">🔗 访问官网</a>
            <button class="btn" onclick="toggleDetail('${p.id}')">📋 查看详情</button>
          </div>
          <div class="detail-panel" id="detail-${p.id}">
            <div class="pros-cons">
              <div class="pros">
                <h4>✅ 优点</h4>
                <ul>${p.pros.map(x => `<li>${x}</li>`).join('')}</ul>
              </div>
              <div class="cons">
                <h4>❌ 缺点</h4>
                <ul>${p.cons.map(x => `<li>${x}</li>`).join('')}</ul>
              </div>
            </div>
          </div>
        </div>
      `;
    }

      const el = document.getElementById(`detail-${id}`);
      el.classList.toggle('open');
    }

      const type = document.getElementById('typeFilter').value;
      const price = document.getElementById('priceFilter').value;
      
      let filtered = platforms.filter(p => {
        if (currentCity !== 'all' && !p.cities.includes('all') && !p.cities.includes(currentCity)) return false;
        if (type !== 'all' && p.type !== type) return false;
        if (search && !p.name.toLowerCase().includes(search) && !p.desc.toLowerCase().includes(search)) return false;
        if (price !== 'all') {
          const min = p.price.includes('€') ? parseInt(p.price.match(/€(\d+)/)?.[1] || 0) : 0;
          if (price === 'low' && min > 600) return false;
          if (price === 'mid' && (min < 600 || min > 900)) return false;
          if (price === 'high' && min < 900) return false;
        }
        return true;
      });

      const container = document.getElementById('platformsList');
      if (filtered.length === 0) {
        container.innerHTML = '<div class="no-results">😕 没有找到匹配的平台，试试其他筛选条件吧～</div>';
      } else {
        container.innerHTML = `
          <div class="section-title">🏠 租房平台 <span class="badge">${filtered.length}个</span></div>
          ${filtered.map(p => renderCard(p)).join('')}
        `;
      }

      const favs = platforms.filter(p => favorites.includes(p.id));
      const favSection = document.getElementById('favoritesSection');
      const favList = document.getElementById('favoritesList');
      if (favs.length > 0) {
        favSection.style.display = 'block';
        favList.innerHTML = favs.map(p => renderCard(p)).join('');
      } else {
        favSection.style.display = 'none';
      }
    }

    renderCityTabs();
    filterPlatforms();
  </script>
</body>
</html>
